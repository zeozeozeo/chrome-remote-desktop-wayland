# Optional: enable verbose (--v=1) host logging.
#
#   sudo mkdir -p /etc/systemd/system/chrome-remote-desktop.service.d
#   sudo cp debug/verbose.conf /etc/systemd/system/chrome-remote-desktop.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart chrome-remote-desktop
#
# Very chatty: WebRTC logs every ICE candidate and SDP mangle, hundreds of KB per
# minute of an active session. Remove the drop-in and daemon-reload when done.
[Service]
ExecStart=
ExecStart=/opt/google/chrome-remote-desktop/chrome-remote-desktop-host --type=daemon --v=1
